<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyParty趴趴科技：科技向善·疗愈人心</title>
<link rel="icon" href="icon.png" type="image/x-icon">
<style>
  /* ============ 设计令牌 ============ */
  :root{
    --bg-deep:#1d0a3e;
    --bg-mid:#3b1572;
    --bg-purple:#5b2a96;
    --bg-pink:#8e3a8f;
    --rose-gold-1:#f7e0c8;
    --rose-gold-2:#e8b890;
    --rose-gold-3:#c98a5e;
    --card-bg:rgba(255,255,255,0.08);
    --card-border:rgba(247,224,200,0.35);
    --text-main:#f5ecff;
    --text-dim:#c9b8e0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans CN",sans-serif;
    color:var(--text-main);
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,184,144,0.07), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 15%, rgba(180,150,220,0.04), transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% 60%, rgba(232,184,144,0.03), transparent 60%),
      linear-gradient(180deg, #0b0b0d 0%, #16161c 45%, #0b0b0d 100%);
    background-attachment:fixed;
    position:relative;
  }
  /* 浮动花瓣装饰 */
  .petal{
    position:fixed;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
    animation:float 12s ease-in-out infinite;
  }
.petal.p1{top:8%;left:5%;width:18px;height:18px;background:radial-gradient(circle,rgba(232,184,144,0.6),transparent 70%);border-radius:50%}
.petal.p2{top:20%;right:8%;width:24px;height:24px;background:radial-gradient(circle,rgba(247,224,200,0.5),transparent 70%);border-radius:50%;animation-delay:-3s}
.petal.p3{top:55%;left:3%;width:14px;height:14px;background:radial-gradient(circle,rgba(232,184,144,0.4),transparent 70%);border-radius:50%;animation-delay:-6s}
.petal.p4{top:75%;right:5%;width:20px;height:20px;background:radial-gradient(circle,rgba(201,138,94,0.5),transparent 70%);border-radius:50%;animation-delay:-9s}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-20px) rotate(180deg)}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    padding:48px 22px 40px;
  }

  /* ============ HERO ============ */
  .hero{text-align:center;margin-bottom:44px}
  .hero-avatar{
    width:96px;height:96px;
    border-radius:50%;
    border:3px solid transparent;
    background:
      linear-gradient(#3b1572,#3b1572) padding-box,
      linear-gradient(135deg,var(--rose-gold-1),var(--rose-gold-3)) border-box;
    padding:4px;
    margin:0 auto 18px;
    box-shadow:0 0 30px rgba(232,184,144,0.4);
  }
  .hero-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .hero h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:1px;
    line-height:1.2;
    background:linear-gradient(135deg,var(--rose-gold-1) 0%,var(--rose-gold-2) 45%,var(--rose-gold-3) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    text-shadow:0 2px 20px rgba(232,184,144,0.25);
    margin-bottom:10px;
  }
  .hero .sub{
    font-size:15px;
    color:var(--text-dim);
    letter-spacing:3px;
    font-weight:300;
  }
  .hero .sub::before,.hero .sub::after{
    content:"";
    display:inline-block;
    width:28px;height:1px;
    background:linear-gradient(90deg,transparent,var(--rose-gold-2));
    vertical-align:middle;
    margin:0 10px;
  }
  .hero .sub::after{
    background:linear-gradient(90deg,var(--rose-gold-2),transparent);
  }

  /* ============ 项目卡片 ============ */
  .projects{display:flex;flex-direction:column;gap:18px;margin-bottom:44px}
  .card{
    position:relative;
    border-radius:20px;
    padding:24px 22px;
    background:var(--card-bg);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border);
    box-shadow:0 8px 32px rgba(20,5,50,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    overflow:hidden;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--rose-gold-2),transparent);
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(232,184,144,0.25)}
  .card-head{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px;text-align:center}
  .card-avatar{
    flex-shrink:0;
    width:64px;height:64px;
    border-radius:50%;
    padding:3px;
    background:
      linear-gradient(rgba(59,21,114,0.6),rgba(59,21,114,0.6)) padding-box,
      linear-gradient(135deg,var(--rose-gold-1),var(--rose-gold-3)) border-box;
    border:2px solid transparent;
  }
  .card-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.card-title{text-align:center}
  .card-title .en{
    font-size:11px;
    letter-spacing:2px;
    color:var(--rose-gold-2);
    text-transform:uppercase;
    margin-bottom:4px;
    opacity:0.85;
  }
  .card-title h2{
    font-size:20px;
    font-weight:700;
    background:linear-gradient(135deg,var(--rose-gold-1),var(--rose-gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  .card-desc{font-size:14px;line-height:1.7;color:var(--text-main);text-align:center}
  .card-desc .line1{color:var(--text-main);font-weight:500;margin-bottom:4px}
  .card-desc .line2{color:var(--text-dim);font-size:13px;letter-spacing:1px}

  /* ============ 底部 ============ */
  .footer{
    text-align:center;
    padding-top:28px;
    border-top:1px solid rgba(247,224,200,0.15);
  }
  .qr-box{
    width:120px;height:120px;
    margin:0 auto 14px;
    border-radius:12px;
    padding:8px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
  }

  .founder .name{
    background:linear-gradient(135deg,var(--rose-gold-1),var(--rose-gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    font-weight:600;
    font-size:14px;
  }
  .beian{
    font-size:11px;
    color:rgba(201,184,224,0.6);
    margin-top:14px;
    line-height:1.6;
  }
  .beian a{color:rgba(201,184,224,0.7);text-decoration:none}
  .beian a:hover{color:var(--rose-gold-2)}

  /* ============ 桌面适配 ============ */
  @media(min-width:768px){
    .wrap{max-width:720px;padding:60px 40px}
    .hero h1{font-size:46px}
    .projects{gap:22px}
    .card{padding:28px 30px}
    .card-title h2{font-size:24px}
    .card-desc{font-size:15px}
  }
</style>
</head>
<body>

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>

<div class="wrap">

  <!-- HERO -->
  <section class="hero">
    <!--<div class="hero-avatar">
      <img src="logo.png" alt="趴趴科技">
    </div>-->
    <h1>PartyParty</h1>
    <h1>趴趴科技</h1>
    <div class="sub">科技向善 · 疗愈人心</div>
  </section>

  <!-- 三大项目 -->
  <section class="projects">

    <div class="card">
      <div class="card-head">
        <div class="card-avatar">
          <img src="mplogo.png" alt="MissParty">
        </div>
        <div class="card-title">
          <div class="en">Miss Party</div>
          <h2>玫瑰派对</h2>
        </div>
      </div>
      <div class="card-desc">
        <div class="line1">专属"大女主"的私享服务平台</div>
        <div class="line2">只偏爱"万分之一"的妳</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-avatar">
          <img src="cplogo.png" alt="CrazyParty">
        </div>
        <div class="card-title">
          <div class="en">Crazy Party</div>
          <h2>狂趴车友</h2>
        </div>
      </div>
      <div class="card-desc">
        <div class="line1">Crazy Party，Play Together！</div>
        <div class="line2">狂趴车友，一起嗨玩！</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-avatar">
          <img src="cpllogo.png" alt="CuteParty">
        </div>
        <div class="card-title">
          <div class="en">Cute Party</div>
          <h2>萌趴乐园</h2>
        </div>
      </div>
      <div class="card-desc">
        <div class="line1">萌宠主题快乐屋</div>
        <div class="line2">快乐你的快乐</div>
      </div>
    </div>

  </section>

  <!-- 底部 -->
  <footer class="footer">
    <div class="beian">
 <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">粤ICP备2026139548号</a>
    </div>
  </footer>

</div>

</body>
</html>
